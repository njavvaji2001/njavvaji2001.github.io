<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nithin Javvaji | Cybersecurity & GRC Analyst Portfolio</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: #161f33;
      --border-color: #26334d;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.85;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .logo span {
      color: var(--accent-cyan);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
    }

    nav a:hover {
      color: var(--accent-cyan);
    }

    /* Layout Containers */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 4.5rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    section:last-of-type {
      border-bottom: none;
    }

    h2.section-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }

    /* Hero Section */
    .hero {
      padding: 5.5rem 0 4.5rem;
      background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.12), transparent 45%);
    }

    .badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: 2.75rem;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    .hero p {
      max-width: 780px;
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .meta-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .meta-item strong {
      display: block;
      color: var(--accent-cyan);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent-cyan);
      color: #0b0f19;
    }

    .btn-primary:hover {
      background-color: #22d3ee;
      opacity: 1;
    }

    .btn-outline {
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      border-color: var(--accent-cyan);
      opacity: 1;
    }

    /* Project Tabs & Cards */
    .project-tabs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active,
    .tab-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-primary);
      background: rgba(6, 182, 212, 0.1);
    }

    .project-panel {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2rem;
    }

    .project-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .project-panel h3 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
    }

    .project-panel p {
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }

    .sub-heading {
      font-size: 1.1rem;
      margin: 1.75rem 0 1rem;
      color: var(--text-primary);
    }

    /* Controls Matrix Table */
    .table-wrapper {
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      text-align: left;
    }

    th, td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      font-weight: 600;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .status-fail {
      color: var(--accent-red);
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .status-pass {
      color: var(--accent-emerald);
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .styled-list {
      list-style: none;
      display: grid;
      gap: 0.75rem;
    }

    .styled-list li {
      background: var(--bg-secondary);
      border-left: 3px solid var(--accent-cyan);
      padding: 0.85rem 1rem;
      border-radius: 0 6px 6px 0;
      color: var(--text-secondary);
    }

    .styled-list li strong {
      color: var(--text-primary);
    }

    /* Competencies Grid */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      color: var(--accent-cyan);
    }

    .card ul {
      list-style-position: inside;
      color: var(--text-secondary);
      display: grid;
      gap: 0.75rem;
      font-size: 0.95rem;
    }

    .card li strong {
      color: var(--text-primary);
    }

    /* Experience & Certifications */
    .timeline-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .timeline-header h3 {
      font-size: 1.2rem;
    }

    .timeline-date {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-cyan);
    }

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .cert-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      border-radius: 8px;
    }

    .cert-item h4 {
      margin-bottom: 0.25rem;
    }

    .cert-item span {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    /* Footer */
    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    footer p {
      max-width: 650px;
      margin: 0 auto 1.25rem;
    }

    @media (max-width: 680px) {
      .hero h1 { font-size: 2.1rem; }
      nav ul { gap: 1rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
